<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">URL Shortener</h1>
        <form method="POST" action="{{ url_for('main.index') }}">
            <input type="url" name="url" placeholder="Enter your URL" class="w-full p-2 border rounded mb-4" required>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Shorten</button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mt-4 text-red-500 text-center">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}
        {% if short_url %}
            <div class="mt-4 text-center">
                <p class="text-green-500">Shortened URL:</p>
                <a href="{{ short_url }}" class="text-blue-500 underline">{{ short_url }}</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
